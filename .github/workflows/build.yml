name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Build
    # Set the type of machine to run on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref != 'refs/heads/master'

    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npx eslint **/*.ts
      - run: npm run test

  publish:
    name: Publish
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    # Set the type of machine to run on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusted publishing: npm exchanges the GitHub OIDC token for a short-lived publish
    # token. No NPM_TOKEN secret is used. `contents: write` lets the job push the version commit.
    permissions:
      id-token: write
      contents: write
    # Two merges in a row must not race on the version commit.
    concurrency:
      group: publish-master
      cancel-in-progress: false

    steps:
      # Check out the tip of master, not the triggering commit, so that a re-run sees the
      # version commit of a failed attempt.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-tags: true
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run test
      - run: git config --global user.name 'ima-bot'
      - run: git config --global user.email 'ima-bot@ima-tech.ca'
      # Bump only when HEAD is not already a release: a re-run after a failed publish keeps
      # the version of the first attempt.
      - name: Bump version (skipped when HEAD is already tagged)
        run: |
          existing_tag="$(git tag --points-at HEAD 'v*')"
          if [ -n "$existing_tag" ]; then
            echo "HEAD is already tagged ($existing_tag); skipping the version bump."
            exit 0
          fi
          npm version patch -m "v%s"
          git push --follow-tags origin HEAD:master
      # `prepare` builds the package. Skip the publish when this version is already on npm.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@pristine-ts/class-validator@$version" version >/dev/null 2>&1; then
            echo "@pristine-ts/class-validator@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
